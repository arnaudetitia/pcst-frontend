<div class="gestion-questions-container">
  <bouton-retour></bouton-retour>
  <champ-label [text]="'Gestion des questions'" [ratio]="7"></champ-label>
  <div class="actions-container">
    <champ-button
      [text]="'Créer de nouvelles questions'"
      [ratio]="10"
      [matMenuTriggerFor]="creationImportQuestionsMenu"
    ></champ-button>
    <mat-menu #creationImportQuestionsMenu="matMenu">
      <button mat-menu-item (click)="openAddQuestionDialog()">Unitairement</button>
      <button mat-menu-item (click)="openImportQuestionsDialog()">Par import de fichier</button>
    </mat-menu>
    <filtrage-question (onFiltreValueChange)="updateFiltre($event)"></filtrage-question>
  </div>
  <div class="table-wrapper">
    <table mat-table [dataSource]="allQuestions()">
      <ng-container matColumnDef="question">
        <th mat-header-cell *matHeaderCellDef>Question</th>
        <td mat-cell *matCellDef="let question">
          @let parties = getQuestionArray(question.question, question.motIndice);
          <span>{{ parties[0] }}</span>
          @if (parties[1]) {
            <span class="mot-indice">{{ parties[1] }}</span>
          }
          <span>{{ parties[2] }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="reponses">
        <th mat-header-cell *matHeaderCellDef>Réponses</th>
        <td mat-cell *matCellDef="let question">
          <div class="reponses-list">
            @for (reponse of question.reponses; track $index) {
              <div
                class="reponse-item"
                [ngClass]="{
                  'reponse-inferieure': reponse < question.bonneReponse,
                  'bonne-reponse': reponse === question.bonneReponse,
                  'reponse-superieure': reponse > question.bonneReponse,
                }"
              >
                {{ reponse.toLocaleString('fr-FR') }}
              </div>
            }
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let question">
          <button matButton (click)="openEditQuestionDialog(question)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
