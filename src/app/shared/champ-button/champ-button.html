<svg [attr.viewBox]="viewBox" [ngClass]="{ disabled: inactivated }">
  <path
    [attr.d]="pathD"
    fill="#a7074b"
    stroke="black"
    stroke-width="10"
    stroke-linejoin="miter"
  ></path>
  <text
    [attr.x]="ratio * 50"
    y="50"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="white"
    font-size="50"
    font-family="Gadugi"
  >
    {{ text }}
  </text>
</svg>
