<div [ngClass]="{ disabled: inactivated }">
  <svg [attr.viewBox]="viewBox">
    <path
      [attr.d]="pathD"
      [attr.fill]="colorFill"
      stroke="black"
      stroke-width="10"
      stroke-linejoin="miter"
    ></path>
    <text
      [attr.x]="ratio * 50"
      y="50"
      text-anchor="middle"
      dominant-baseline="middle"
      fill="white"
      font-size="50"
      font-family="Gadugi"
    >
      {{ text }}
    </text>
  </svg>
</div>
